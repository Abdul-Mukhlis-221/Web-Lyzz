<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tugas Deadline</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 19px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        button {
            border: none;
            padding: 11px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 3px;
        }

        .btn-add {
            width: 100%;
            background: #2563eb;
            color: white;
        }

        .btn-notif {
            width: 100%;
            background: #16a34a;
            color: white;
            margin-top: 10px;
        }

        .btn-test {
            width: 100%;
            background: #f59e0b;
            color: white;
            margin-top: 10px;
        }

        .task {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .task h3 {
            margin-bottom: 8px;
        }

        .deadline {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .countdown {
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 10px;
        }

        .btn-edit {
            background: #2563eb;
            color: white;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .status {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Tugas Deadline</h1>
    <p>Catat dan pantau deadline tugas kamu</p>
</header>


<div class="container">

    <!-- FORM TAMBAH TUGAS -->
    <div class="card">

        <h2>➕ Tambah Tugas</h2>

        <label for="taskName">
            Nama Tugas
        </label>

        <input
            type="text"
            id="taskName"
            placeholder="Masukkan nama tugas"
        >


        <label for="taskDeadline">
            Deadline
        </label>

        <input
            type="datetime-local"
            id="taskDeadline"
        >


        <button
            class="btn-add"
            onclick="addTask()"
        >
            ➕ Tambahkan Tugas
        </button>

    </div>


    <!-- NOTIFIKASI -->
    <div class="card">

        <h2>🔔 Notifikasi</h2>

        <button
            class="btn-notif"
            onclick="mintaIzinNotifikasi()"
        >
            🔔 Aktifkan Notifikasi
        </button>

        <button
            class="btn-test"
            onclick="testNotification()"
        >
            🔔 Tes Notifikasi
        </button>

        <div
            class="status"
            id="notificationStatus"
        >
            Status: Mengecek izin...
        </div>

    </div>


    <!-- DAFTAR TUGAS -->
    <div class="card">

        <h2>📋 Daftar Tugas</h2>

        <div id="taskList">
            <div class="empty">
                Belum ada tugas.
            </div>
        </div>

    </div>

</div>


<script>

/* =====================================
   DATA TUGAS
===================================== */

let tasks = JSON.parse(
    localStorage.getItem("tugasDeadline")
) || [];


/* =====================================
   STATUS ALARM
===================================== */

let alarmStatus =
    JSON.parse(
        localStorage.getItem("alarmStatus")
    ) || {};


/* =====================================
   SIMPAN TUGAS
===================================== */

function saveTasks() {

    localStorage.setItem(
        "tugasDeadline",
        JSON.stringify(tasks)
    );

}


/* =====================================
   SIMPAN STATUS ALARM
===================================== */

function saveAlarmStatus() {

    localStorage.setItem(
        "alarmStatus",
        JSON.stringify(alarmStatus)
    );

}


/* =====================================
   FORMAT TANGGAL
===================================== */

function formatDate(date) {

    return new Date(date).toLocaleString(
        "id-ID",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================
   HITUNG COUNTDOWN
===================================== */

function getCountdown(deadline) {

    const sekarang =
        new Date().getTime();

    const target =
        new Date(deadline).getTime();

    let selisih =
        target - sekarang;


    if (selisih <= 0) {
        return "⛔ DEADLINE";
    }


    const hari =
        Math.floor(
            selisih /
            (1000 * 60 * 60 * 24)
        );


    selisih %=
        1000 * 60 * 60 * 24;


    const jam =
        Math.floor(
            selisih /
            (1000 * 60 * 60)
        );


    selisih %=
        1000 * 60 * 60;


    const menit =
        Math.floor(
            selisih /
            (1000 * 60)
        );


    const detik =
        Math.floor(
            selisih /
            1000
        );


    return `${hari} hari ${jam} jam ${menit} menit ${detik} detik`;

}


/* =====================================
   NOTIFIKASI
===================================== */

function kirimNotifikasi(
    judul,
    pesan
) {

    if (!("Notification" in window)) {

        alert(
            "Browser tidak mendukung notifikasi."
        );

        return;
    }


    if (
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            judul,
            {
                body: pesan,

                icon:
                "https://cdn-icons-png.flaticon.com/512/1827/1827392.png",

                tag:
                "tugas-deadline"
            }
        );

    }

}


/* =====================================
   MINTA IZIN NOTIFIKASI
===================================== */

function mintaIzinNotifikasi() {

    if (!("Notification" in window)) {

        alert(
            "Browser kamu tidak mendukung notifikasi."
        );

        return;
    }


    Notification.requestPermission()
        .then(permission => {

            updateNotificationStatus();


            if (
                permission ===
                "granted"
            ) {

                kirimNotifikasi(
                    "🔔 Tugas Deadline",
                    "Notifikasi berhasil diaktifkan!"
                );

            }

        });

}


/* =====================================
   STATUS NOTIFIKASI
===================================== */

function updateNotificationStatus() {

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if (!("Notification" in window)) {

        status.innerText =
            "Status: Browser tidak mendukung notifikasi.";

        return;
    }


    if (
        Notification.permission ===
        "granted"
    ) {

        status.innerText =
            "Status: ✅ Notifikasi aktif";

    }

    else if (
        Notification.permission ===
        "denied"
    ) {

        status.innerText =
            "Status: ❌ Notifikasi ditolak";

    }

    else {

        status.innerText =
            "Status: ⚠️ Belum diaktifkan";

    }

}


/* =====================================
   TES NOTIFIKASI
===================================== */

function testNotification() {

    if (
        Notification.permission !==
        "granted"
    ) {

        mintaIzinNotifikasi();

        return;
    }


    kirimNotifikasi(
        "🔔 Tugas Deadline",
        "Ini adalah notifikasi percobaan dari aplikasi Tugas Deadline."
    );

}


/* =====================================
   TAMBAH TUGAS
===================================== */

function addTask() {

    const nama =
        document.getElementById(
            "taskName"
        ).value.trim();


    const deadline =
        document.getElementById(
            "taskDeadline"
        ).value;


    if (!nama || !deadline) {

        alert(
            "Nama tugas dan deadline harus diisi!"
        );

        return;
    }


    const task = {

        id:
        Date.now().toString(),

        name:
        nama,

        deadline:
        deadline

    };


    tasks.push(task);

    saveTasks();

    loadTasks();


    document.getElementById(
        "taskName"
    ).value = "";


    document.getElementById(
        "taskDeadline"
    ).value = "";

}


/* =====================================
   TAMPILKAN TUGAS
===================================== */

function loadTasks() {

    const container =
        document.getElementById(
            "taskList"
        );


    container.innerHTML = "";


    if (tasks.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Belum ada tugas.
            </div>
        `;

        return;
    }


    tasks.forEach(task => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "task";


        div.innerHTML = `

            <h3>
                📚 ${escapeHTML(task.name)}
            </h3>

            <div class="deadline">
                ⏰ Deadline:
                ${formatDate(task.deadline)}
            </div>

            <div
                class="countdown"
                id="countdown-${task.id}"
            >
                ${getCountdown(task.deadline)}
            </div>

            <button
                class="btn-edit"
                onclick="editTask('${task.id}')"
            >
                ✏️ Edit
            </button>

            <button
                class="btn-delete"
                onclick="deleteTask('${task.id}')"
            >
                🗑️ Hapus
            </button>

        `;


        container.appendChild(div);

    });

}


/* =====================================
   PENGAMAN TEKS
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================
   EDIT TUGAS
===================================== */

function editTask(id) {

    const task =
        tasks.find(
            item => item.id === id
        );


    if (!task) return;


    const namaBaru =
        prompt(
            "Masukkan nama tugas:",
            task.name
        );


    if (
        namaBaru === null ||
        namaBaru.trim() === ""
    ) {
        return;
    }


    const deadlineBaru =
        prompt(
            "Masukkan deadline dalam format YYYY-MM-DDTHH:MM",
            task.deadline
        );


    if (
        deadlineBaru === null ||
        deadlineBaru.trim() === ""
    ) {
        return;
    }


    task.name =
        namaBaru.trim();


    task.deadline =
        deadlineBaru;


    saveTasks();

    loadTasks();

}


/* =====================================
   HAPUS TUGAS
===================================== */

function deleteTask(id) {

    const yakin =
        confirm(
            "Apakah kamu yakin ingin menghapus tugas ini?"
        );


    if (!yakin) return;


    tasks =
        tasks.filter(
            task => task.id !== id
        );


    delete alarmStatus[id + "_1day"];
    delete alarmStatus[id + "_3hour"];
    delete alarmStatus[id + "_deadline"];


    saveTasks();

    saveAlarmStatus();

    loadTasks();

}


/* =====================================
   CEK ALARM
===================================== */

function checkAlarms() {

    const sekarang =
        Date.now();


    tasks.forEach(task => {

        const deadline =
            new Date(
                task.deadline
            ).getTime();


        const sisa =
            deadline - sekarang;


        /* ==========================
           1 HARI SEBELUM
        ========================== */

        if (
            sisa <=
            24 * 60 * 60 * 1000 &&

            sisa >
            23 * 60 * 60 * 1000
        ) {

            const key =
                task.id + "_1day";


            if (!alarmStatus[key]) {

                kirimNotifikasi(
                    "🔔 Tugas Deadline",
                    `Deadline tinggal 1 hari lagi!\n📚 ${task.name}\n⏰ ${formatDate(task.deadline)}`
                );


                alarmStatus[key] =
                    true;


                saveAlarmStatus();

            }

        }


        /* ==========================
           3 JAM SEBELUM
        ========================== */

        if (
            sisa <=
            3 * 60 * 60 * 1000 &&

            sisa >
            2 * 60 * 60 * 1000
        ) {

            const key =
                task.id + "_3hour";


            if (!alarmStatus[key]) {

                kirimNotifikasi(
                    "🚨 Deadline 3 Jam Lagi",
                    `Deadline tinggal 3 jam lagi!\n📚 ${task.name}\n⏰ ${formatDate(task.deadline)}`
                );


                alarmStatus[key] =
                    true;


                saveAlarmStatus();

            }

        }


        /* ==========================
           SAAT DEADLINE
        ========================== */

        if (
            sisa <= 0 &&

            sisa >
            -60 * 1000
        ) {

            const key =
                task.id + "_deadline";


            if (!alarmStatus[key]) {

                kirimNotifikasi(
                    "🚨 DEADLINE TUGAS",
                    `Waktu pengumpulan telah tiba!\n📚 ${task.name}\n⏰ ${formatDate(task.deadline)}`
                );


                alarmStatus[key] =
                    true;


                saveAlarmStatus();

            }

        }

    });

}


/* =====================================
   UPDATE COUNTDOWN
===================================== */

function updateCountdown() {

    tasks.forEach(task => {

        const element =
            document.getElementById(
                "countdown-" +
                task.id
            );


        if (element) {

            element.innerText =
                getCountdown(
                    task.deadline
                );

        }

    });

}


/* =====================================
   JALANKAN SETIAP 1 DETIK
===================================== */

setInterval(
    updateCountdown,
    1000
);


/* =====================================
   CEK ALARM SETIAP 10 DETIK
===================================== */

setInterval(
    checkAlarms,
    10000
);


/* =====================================
   SAAT HALAMAN DIBUKA
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadTasks();

        updateCountdown();

        updateNotificationStatus();

        checkAlarms();

    }
);

</script>

</body>
</html>
