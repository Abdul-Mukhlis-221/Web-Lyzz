<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        #taskInput:focus {
            border-color: #667eea;
        }

        #addBtn {
            border: none;
            background: #667eea;
            color: white;
            padding: 0 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
        }

        #addBtn:hover {
            background: #5568d9;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f6fa;
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        li span {
            flex: 1;
            color: #333;
            word-break: break-word;
        }

        li.completed span {
            text-decoration: line-through;
            color: #999;
        }

        .check-btn {
            width: 30px;
            height: 30px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            color: #667eea;
            font-weight: bold;
        }

        .delete-btn {
            border: none;
            background: #ff5c5c;
            color: white;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e04444;
        }

        .info {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List</h1>
        <p class="subtitle">Atur tugasmu agar lebih terorganisir</p>

        <div class="input-area">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Masukkan tugas..."
            >

            <button id="addBtn">+</button>
        </div>

        <ul id="taskList"></ul>

        <div class="info">
            <span>Total: <b id="totalTask">0</b></span>
            <span>Selesai: <b id="completedTask">0</b></span>
        </div>

    </div>

    <script>

        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const totalTask = document.getElementById("totalTask");
        const completedTask = document.getElementById("completedTask");

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function tampilkanTugas() {

            taskList.innerHTML = "";

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty">
                        Belum ada tugas 🎉
                    </div>
                `;
            }

            tasks.forEach((task, index) => {

                const li = document.createElement("li");

                if (task.completed) {
                    li.classList.add("completed");
                }

                li.innerHTML = `
                    <button class="check-btn" onclick="selesaiTugas(${index})">
                        ${task.completed ? "✓" : ""}
                    </button>

                    <span>${task.text}</span>

                    <button class="delete-btn" onclick="hapusTugas(${index})">
                        🗑️
                    </button>
                `;

                taskList.appendChild(li);
            });

            updateInfo();
        }

        function tambahTugas() {

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Masukkan tugas terlebih dahulu!");
                return;
            }

            tasks.push({
                text: text,
                completed: false
            });

            simpanData();

            taskInput.value = "";

            tampilkanTugas();
        }

        function selesaiTugas(index) {

            tasks[index].completed = !tasks[index].completed;

            simpanData();

            tampilkanTugas();
        }

        function hapusTugas(index) {

            tasks.splice(index, 1);

            simpanData();

            tampilkanTugas();
        }

        function simpanData() {

            localStorage.setItem("tasks", JSON.stringify(tasks));

        }

        function updateInfo() {

            totalTask.textContent = tasks.length;

            const selesai = tasks.filter(
                task => task.completed
            ).length;

            completedTask.textContent = selesai;
        }

        addBtn.addEventListener("click", tambahTugas);

        taskInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                tambahTugas();
            }

        });

        tampilkanTugas();

    </script>

</body>
</html>
