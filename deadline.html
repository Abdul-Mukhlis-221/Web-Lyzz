<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">

<link rel="manifest" href="manifest.json">

<title>Tugas Deadline</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5fb;
    color:#202534;
}

.app{
    max-width:480px;
    min-height:100vh;
    margin:auto;
    padding-bottom:90px;
}

.header{
    background:linear-gradient(135deg,#6c63ff,#8b5cf6);
    color:white;
    padding:28px 20px 24px;
    border-radius:0 0 30px 30px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:45px;
    height:45px;
    background:rgba(255,255,255,.2);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.logo h1{
    font-size:20px;
}

.logo p{
    font-size:11px;
    opacity:.8;
    margin-top:4px;
}

.clock{
    background:rgba(255,255,255,.18);
    padding:9px 11px;
    border-radius:11px;
    font-size:13px;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:22px;
}

.stat{
    text-align:center;
    background:rgba(255,255,255,.15);
    padding:12px 5px;
    border-radius:14px;
}

.stat b{
    display:block;
    font-size:20px;
}

.stat span{
    font-size:10px;
    opacity:.8;
}

.content{
    padding:20px;
}

.add{
    width:100%;
    border:0;
    padding:15px;
    border-radius:15px;
    background:#202534;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    margin-bottom:18px;
}

.form{
    display:none;
    background:white;
    padding:18px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.form.show{
    display:block;
}

.form-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:17px;
}

.close{
    border:0;
    background:#f0f1f6;
    border-radius:9px;
    width:30px;
    height:30px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-size:11px;
    color:#777f91;
    font-weight:bold;
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:13px;
    border:1px solid #e4e6ed;
    border-radius:11px;
    background:#f9fafc;
    outline:none;
}

.save{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#6c63ff,#8b5cf6);
    color:white;
    font-weight:bold;
}

.section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.section h2{
    font-size:18px;
}

.section span{
    font-size:11px;
    color:#7d8493;
}

.task{
    background:white;
    padding:17px;
    border-radius:19px;
    margin-bottom:12px;
    border:1px solid #e9eaf0;
    box-shadow:0 4px 16px rgba(0,0,0,.04);
}

.task-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.task-name{
    font-size:16px;
    font-weight:bold;
}

.badge{
    font-size:9px;
    font-weight:bold;
    padding:5px 8px;
    border-radius:8px;
}

.safe{
    background:#dcfce7;
    color:#15803d;
}

.warning{
    background:#fef3c7;
    color:#b45309;
}

.danger{
    background:#fee2e2;
    color:#b91c1c;
}

.deadline{
    color:#7b8291;
    font-size:12px;
    margin-top:8px;
}

.countdown{
    margin-top:12px;
    padding:10px;
    background:#f6f7fa;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.alarm{
    margin-top:11px;
    color:#7b8291;
    font-size:10px;
    line-height:1.8;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.action{
    flex:1;
    border:0;
    padding:9px;
    border-radius:9px;
    font-weight:bold;
}

.edit{
    background:#fff7ed;
    color:#c2410c;
}

.delete{
    background:#fef2f2;
    color:#dc2626;
}

.test{
    width:100%;
    padding:12px;
    border:1px dashed #aaa;
    background:white;
    border-radius:12px;
    margin-top:5px;
}

.empty{
    background:white;
    border-radius:18px;
    padding:35px 15px;
    text-align:center;
    color:#858b99;
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:white;
    border-top:1px solid #e7e8ed;
    display:flex;
    justify-content:space-around;
    padding:11px;
}

.nav{
    border:0;
    background:none;
    color:#858b99;
    font-size:10px;
}

.nav span{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

.active{
    color:#6c63ff;
}

.toast{
    position:fixed;
    left:50%;
    bottom:75px;
    transform:translateX(-50%);
    background:#202534;
    color:white;
    padding:11px 15px;
    border-radius:11px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:20;
}

.toast.show{
    opacity:1;
}

@media(min-width:481px){
    body{
        padding:20px 0;
    }

    .app{
        border-radius:30px;
        overflow:hidden;
        box-shadow:0 10px 40px rgba(0,0,0,.12);
    }

    .bottom{
        bottom:20px;
        border-radius:20px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="header-top">

        <div class="logo">

            <div class="logo-icon">📚</div>

            <div>
                <h1>Tugas Deadline</h1>
                <p>Jangan sampai terlambat!</p>
            </div>

        </div>

        <div class="clock" id="clock">
            00:00
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <b id="total">0</b>
            <span>Total</span>
        </div>

        <div class="stat">
            <b id="soon">0</b>
            <span>Segera</span>
        </div>

        <div class="stat">
            <b id="late">0</b>
            <span>Lewat</span>
        </div>

    </div>

</header>


<main class="content">

<button class="add" onclick="openForm()">
    ＋ Tambah Tugas
</button>


<div class="form" id="form">

    <div class="form-title">

        <h2>📝 Tugas Baru</h2>

        <button class="close" onclick="closeForm()">
            ✕
        </button>

    </div>

    <div class="field">

        <label>NAMA TUGAS</label>

        <input
            id="taskName"
            type="text"
            placeholder="Contoh: Tugas Pemrograman">

    </div>

    <div class="field">

        <label>DEADLINE</label>

        <input
            id="deadline"
            type="datetime-local">

    </div>

    <button class="save" onclick="saveTask()">
        💾 Simpan Tugas
    </button>

</div>


<div class="section">

    <h2>📋 Tugas Saya</h2>

    <span id="count">0 tugas</span>

</div>


<div id="taskList"></div>


<button class="test" onclick="testSound()">
    🔊 Tes Suara Alarm
</button>

</main>

</div>


<div class="bottom">

<button class="nav active">
    <span>🏠</span>
    Beranda
</button>

<button class="nav" onclick="openForm()">
    <span>➕</span>
    Tambah
</button>

<button class="nav" onclick="testSound()">
    <span>🔊</span>
    Suara
</button>

</div>


<div class="toast" id="toast"></div>


<script>

let tasks =
JSON.parse(localStorage.getItem("tugasDeadline")) || [];


// ========================
// FORM
// ========================

function openForm(){

    document
    .getElementById("form")
    .classList.add("show");

    document
    .getElementById("taskName")
    .focus();

}

function closeForm(){

    document
    .getElementById("form")
    .classList.remove("show");

}


// ========================
// SAVE TASK
// ========================

function saveTask(){

    const name =
    document.getElementById("taskName").value.trim();

    const deadline =
    document.getElementById("deadline").value;

    if(!name || !deadline){

        toast("⚠️ Lengkapi data tugas!");

        return;
    }

    if(new Date(deadline).getTime() <= Date.now()){

        toast("⚠️ Deadline harus di masa depan!");

        return;
    }

    tasks.push({

        id:Date.now(),

        name:name,

        deadline:deadline,

        alarm3:false,

        alarmDeadline:false

    });

    save();

    document.getElementById("taskName").value="";
    document.getElementById("deadline").value="";

    closeForm();

    render();

    requestNotification();

    toast("✅ Tugas berhasil ditambahkan");

}


// ========================
// STORAGE
// ========================

function save(){

    localStorage.setItem(
        "tugasDeadline",
        JSON.stringify(tasks)
    );

}


// ========================
// RENDER
// ========================

function render(){

    const list =
    document.getElementById("taskList");

    document.getElementById("total")
    .innerText=tasks.length;

    document.getElementById("count")
    .innerText=tasks.length+" tugas";

    let soon=0;
    let late=0;

    tasks.forEach(t=>{

        const diff =
        new Date(t.deadline).getTime()
        -Date.now();

        if(diff>0 && diff<=86400000)
            soon++;

        if(diff<=0)
            late++;

    });

    document.getElementById("soon")
    .innerText=soon;

    document.getElementById("late")
    .innerText=late;


    if(tasks.length===0){

        list.innerHTML=`

        <div class="empty">

            <div class="empty-icon">📚</div>

            <b>Belum ada tugas</b>

            <p style="margin-top:6px">
                Tambahkan tugas pertamamu.
            </p>

        </div>`;

        return;
    }


    tasks.sort(
        (a,b)=>
        new Date(a.deadline)
        -
        new Date(b.deadline)
    );


    list.innerHTML="";


    tasks.forEach(task=>{

        const diff =
        new Date(task.deadline).getTime()
        -Date.now();

        let badge="";

        if(diff<=0){

            badge=
            `<span class="badge danger">
                LEWAT
            </span>`;

        }else if(diff<=10800000){

            badge=
            `<span class="badge danger">
                SEGERA
            </span>`;

        }else if(diff<=86400000){

            badge=
            `<span class="badge warning">
                HARI INI
            </span>`;

        }else{

            badge=
            `<span class="badge safe">
                AMAN
            </span>`;

        }


        const div =
        document.createElement("div");

        div.className="task";

        div.innerHTML=`

        <div class="task-head">

            <div class="task-name">
                📚 ${safe(task.name)}
            </div>

            ${badge}

        </div>

        <div class="deadline">
            🗓️ ${formatDate(task.deadline)}
        </div>

        <div
            class="countdown"
            id="count-${task.id}">
            ⏳ Menghitung...
        </div>

        <div class="alarm">

            🔔 Alarm 3 jam:
            ${task.alarm3 ? "✅ Sudah berbunyi" : "⏳ Menunggu"}

            <br>

            🚨 Alarm deadline:
            ${task.alarmDeadline ? "✅ Sudah berbunyi" : "⏳ Menunggu"}

        </div>

        <div class="actions">

            <button
                class="action edit"
                onclick="editTask(${task.id})">
                ✏️ Edit
            </button>

            <button
                class="action delete"
                onclick="deleteTask(${task.id})">
                🗑️ Hapus
            </button>

        </div>

        `;

        list.appendChild(div);

    });

    updateCountdown();

}


// ========================
// COUNTDOWN
// ========================

function updateCountdown(){

    tasks.forEach(task=>{

        const el =
        document.getElementById(
            "count-"+task.id
        );

        if(!el) return;

        const diff =
        new Date(task.deadline).getTime()
        -Date.now();

        if(diff<=0){

            el.innerText=
            "🚨 DEADLINE SUDAH TIBA";

            return;
        }

        let seconds=
        Math.floor(diff/1000);

        const days=
        Math.floor(seconds/86400);

        seconds%=86400;

        const hours=
        Math.floor(seconds/3600);

        seconds%=3600;

        const minutes=
        Math.floor(seconds/60);

        seconds%=60;


        if(days>0){

            el.innerText=
            `⏳ ${days} hari ${hours} jam ${minutes} menit lagi`;

        }else{

            el.innerText=
            `🔥 ${hours} jam ${minutes} menit ${seconds} detik lagi`;

        }

    });

}


// ========================
// ALARM
// ========================

function checkAlarms(){

    const now=Date.now();

    let changed=false;


    tasks.forEach(task=>{

        const deadline=
        new Date(task.deadline).getTime();


        // ALARM 3 JAM

        if(
            now >= deadline-10800000 &&
            now < deadline &&
            !task.alarm3
        ){

            const message=
            `Tugas ${task.name} akan mencapai deadline dalam 3 jam.`;

            speak(message);

            notify(
                "⏰ Pengingat Tugas",
                message
            );

            toast("⏰ "+message);

            task.alarm3=true;

            changed=true;

        }


        // ALARM DEADLINE

        if(
            now>=deadline &&
            !task.alarmDeadline
        ){

            const message=
            `Tugas ${task.name} telah mencapai deadline.`;

            speak(message);

            notify(
                "🚨 Deadline Tugas",
                message
            );

            toast("🚨 "+message);

            task.alarmDeadline=true;

            changed=true;

        }

    });


    if(changed)
        save();

}


// ========================
// TEXT TO SPEECH
// ========================

function speak(text){

    if(!("speechSynthesis" in window)){

        toast("Browser tidak mendukung suara.");

        return;
    }

    speechSynthesis.cancel();

    const voice=
    new SpeechSynthesisUtterance(text);

    voice.lang="id-ID";
    voice.rate=.95;
    voice.pitch=1;
    voice.volume=1;

    speechSynthesis.speak(voice);

}


function testSound(){

    speak(
        "Halo. Ini adalah suara alarm Tugas Deadline. Tugas Anda akan mencapai deadline dalam tiga jam."
    );

    toast("🔊 Tes suara sedang berjalan");

}


// ========================
// NOTIFICATION
// ========================

function requestNotification(){

    if(
        "Notification" in window &&
        Notification.permission==="default"
    ){

        Notification.requestPermission();

    }

}

function notify(title,message){

    if(
        "Notification" in window &&
        Notification.permission==="granted"
    ){

        new Notification(title,{
            body:message,
            icon:"icon-192.png"
        });

    }

}


// ========================
// EDIT
// ========================

function editTask(id){

    const task=
    tasks.find(t=>t.id===id);

    if(!task)return;

    const name=
    prompt("Nama tugas:",task.name);

    if(name===null)return;

    const deadline=
    prompt(
        "Deadline (YYYY-MM-DDTHH:MM):",
        task.deadline
    );

    if(deadline===null)return;

    if(
        new Date(deadline).getTime()
        <=Date.now()
    ){

        toast("⚠️ Deadline tidak valid!");

        return;
    }

    task.name=name.trim();
    task.deadline=deadline;

    task.alarm3=false;
    task.alarmDeadline=false;

    save();
    render();

    toast("✅ Tugas diperbarui");

}


// ========================
// DELETE
// ========================

function deleteTask(id){

    if(
        !confirm("Hapus tugas ini?")
    )return;

    tasks=
    tasks.filter(t=>t.id!==id);

    save();
    render();

    toast("🗑️ Tugas dihapus");

}


// ========================
// CLOCK
// ========================

function updateClock(){

    document.getElementById("clock")
    .innerText=
    new Date().toLocaleTimeString(
        "id-ID",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


// ========================
// HELPERS
// ========================

function formatDate(value){

    return new Date(value)
    .toLocaleString(
        "id-ID",
        {
            day:"numeric",
            month:"long",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

function safe(text){

    return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function toast(message){

    const t=
    document.getElementById("toast");

    t.innerText=message;

    t.classList.add("show");

    setTimeout(
        ()=>t.classList.remove("show"),
        3500
    );

}


// ========================
// SERVICE WORKER
// ========================

if("serviceWorker" in navigator){

    navigator.serviceWorker
    .register("sw.js")
    .catch(
        err=>console.log(err)
    );

}


// ========================
// START
// ========================

render();

updateClock();

requestNotification();

setInterval(updateClock,1000);

setInterval(updateCountdown,1000);

setInterval(checkAlarms,1000);

</script>

</body>
</html>
