<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Tugas Deadline</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:7px 0 0;
    opacity:.8;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-size:15px;
    cursor:pointer;
}

.btn-add{
    width:100%;
    background:#111827;
    color:white;
}

.btn-sound{
    width:100%;
    margin-top:10px;
    background:#2563eb;
    color:white;
}

.task{
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
}

.task h3{
    margin:0 0 8px;
}

.deadline{
    font-weight:bold;
    margin-bottom:8px;
}

.countdown{
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.alarm{
    font-size:14px;
    line-height:1.7;
    background:#f9fafb;
    padding:10px;
    border-radius:10px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.btn-edit{
    background:#f59e0b;
    color:white;
    flex:1;
}

.btn-delete{
    background:#dc2626;
    color:white;
    flex:1;
}

.empty{
    text-align:center;
    color:#6b7280;
    padding:20px;
}

.toast{
    position:fixed;
    left:15px;
    right:15px;
    bottom:20px;
    background:#111827;
    color:white;
    padding:16px;
    border-radius:14px;
    display:none;
    z-index:9999;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.toast.show{
    display:block;
}

.status{
    text-align:center;
    font-size:13px;
    color:#6b7280;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
    <h1>📚 Tugas Deadline</h1>
    <p>Pengingat otomatis 1 hari, 3 jam & deadline</p>
</header>

<div class="container">

    <div class="card">

        <h2>➕ Tambah Tugas</h2>

        <label>Nama Tugas</label>
        <input
            type="text"
            id="taskName"
            placeholder="Contoh: Tugas Data Mining"
        >

        <label>Deadline</label>
        <input
            type="datetime-local"
            id="taskDeadline"
        >

        <button class="btn-add" onclick="addTask()">
            💾 Simpan Tugas
        </button>

        <button class="btn-sound" onclick="testSound()">
            🔊 Tes Suara Alarm
        </button>

        <div class="status" id="notificationStatus">
            Memeriksa izin notifikasi...
        </div>

    </div>

    <div class="card">

        <h2>📋 Daftar Tugas</h2>

        <div id="taskList"></div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>

let tasks = JSON.parse(
    localStorage.getItem("tugasDeadline") || "[]"
);

/* =========================
   SIMPAN DATA
========================= */

function saveTasks(){
    localStorage.setItem(
        "tugasDeadline",
        JSON.stringify(tasks)
    );
}


/* =========================
   TAMBAH TUGAS
========================= */

function addTask(){

    const name =
        document.getElementById("taskName").value.trim();

    const deadline =
        document.getElementById("taskDeadline").value;

    if(!name || !deadline){
        alert("Nama tugas dan deadline harus diisi!");
        return;
    }

    const deadlineTime =
        new Date(deadline).getTime();

    if(deadlineTime <= Date.now()){
        alert("Deadline harus berada di masa depan!");
        return;
    }

    const task = {

        id: Date.now(),

        name:name,

        deadline:deadline,

        alarm1day:false,

        alarm3:false,

        alarmDeadline:false
    };

    tasks.push(task);

    saveTasks();

    document.getElementById("taskName").value="";
    document.getElementById("taskDeadline").value="";

    renderTasks();

    showToast("✅ Tugas berhasil disimpan!");

}


/* =========================
   TAMPILKAN TUGAS
========================= */

function renderTasks(){

    const list =
        document.getElementById("taskList");

    if(tasks.length === 0){

        list.innerHTML =
            `<div class="empty">
                Belum ada tugas 📭
            </div>`;

        return;
    }

    list.innerHTML="";

    tasks.forEach(task => {

        const deadline =
            new Date(task.deadline);

        const div =
            document.createElement("div");

        div.className="task";

        div.innerHTML=`

            <h3>📚 ${escapeHTML(task.name)}</h3>

            <div class="deadline">
                ⏰ Deadline:
                ${formatDate(deadline)}
            </div>

            <div
                class="countdown"
                id="count-${task.id}">
                Menghitung...
            </div>

            <div class="alarm">

                📅 Alarm 1 hari:
                ${task.alarm1day
                    ? "✅ Sudah berbunyi"
                    : "⏳ Menunggu"}

                <br>

                🔔 Alarm 3 jam:
                ${task.alarm3
                    ? "✅ Sudah berbunyi"
                    : "⏳ Menunggu"}

                <br>

                🚨 Alarm deadline:
                ${task.alarmDeadline
                    ? "✅ Sudah berbunyi"
                    : "⏳ Menunggu"}

            </div>

            <div class="actions">

                <button
                    class="btn-edit"
                    onclick="editTask(${task.id})">
                    ✏️ Edit
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteTask(${task.id})">
                    🗑️ Hapus
                </button>

            </div>
        `;

        list.appendChild(div);

    });

}


/* =========================
   HITUNG COUNTDOWN
========================= */

function updateCountdown(){

    tasks.forEach(task => {

        const element =
            document.getElementById(
                "count-"+task.id
            );

        if(!element) return;

        const deadline =
            new Date(task.deadline).getTime();

        let diff =
            deadline - Date.now();

        if(diff <= 0){

            element.innerHTML =
                "🚨 DEADLINE SUDAH TIBA";

            return;
        }

        const days =
            Math.floor(
                diff / 86400000
            );

        diff %= 86400000;

        const hours =
            Math.floor(
                diff / 3600000
            );

        diff %= 3600000;

        const minutes =
            Math.floor(
                diff / 60000
            );

        const seconds =
            Math.floor(
                (diff % 60000) / 1000
            );

        element.innerHTML =
            `⏳ ${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;

    });

}


/* =========================
   CEK ALARM
========================= */

function checkAlarms(){

    const now =
        Date.now();

    let changed=false;

    tasks.forEach(task => {

        const deadline =
            new Date(task.deadline).getTime();


        /* =====================
           ALARM 1 HARI
        ===================== */

        if(
            now >= deadline - 86400000 &&
            now < deadline - 10800000 &&
            !task.alarm1day
        ){

            const message =
                `Perhatian. Tugas ${task.name}. ` +
                `Akan mencapai deadline dalam satu hari.`;

            speak(message);

            notify(
                "📅 Pengingat 1 Hari",
                message
            );

            showToast(
                "📅 "+message
            );

            task.alarm1day=true;

            changed=true;
        }


        /* =====================
           ALARM 3 JAM
        ===================== */

        if(
            now >= deadline - 10800000 &&
            now < deadline &&
            !task.alarm3
        ){

            const message =
                `Perhatian. Tugas ${task.name}. ` +
                `Akan mencapai deadline dalam tiga jam.`;

            speak(message);

            notify(
                "🔔 Pengingat 3 Jam",
                message
            );

            showToast(
                "🔔 "+message
            );

            task.alarm3=true;

            changed=true;
        }


        /* =====================
           ALARM DEADLINE
        ===================== */

        if(
            now >= deadline &&
            !task.alarmDeadline
        ){

            const message =
                `Perhatian. Deadline tugas ` +
                `${task.name} telah tiba.`;

            speak(message);

            notify(
                "🚨 DEADLINE TUGAS",
                message
            );

            showToast(
                "🚨 "+message
            );

            task.alarmDeadline=true;

            changed=true;
        }

    });

    if(changed){

        saveTasks();

        renderTasks();
    }

}


/* =========================
   SUARA ALARM
========================= */

function speak(text){

    if(!("speechSynthesis" in window)){

        alert(
            "Browser kamu tidak mendukung suara otomatis."
        );

        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang="id-ID";

    /*
       Kecepatan dibuat lebih lambat
       supaya suara lebih jelas.
    */

    utterance.rate=0.78;

    /*
       Nada suara normal.
    */

    utterance.pitch=1;

    /*
       Volume maksimal.
    */

    utterance.volume=1;

    const voices =
        speechSynthesis.getVoices();

    const indonesianVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang.toLowerCase()
                .startsWith("id")
        );

    if(indonesianVoice){

        utterance.voice =
            indonesianVoice;
    }

    speechSynthesis.speak(
        utterance
    );

}


/* =========================
   TES SUARA
========================= */

function testSound(){

    const message =
        "Halo. Ini adalah tes suara pengingat tugas. " +
        "Suara alarm sudah aktif. " +
        "Jangan lupa mengerjakan tugas sebelum deadline.";

    speak(message);

    showToast(
        "🔊 Tes suara sedang diputar..."
    );

}


/* =========================
   NOTIFIKASI
========================= */

async function requestNotification(){

    if(!("Notification" in window)){

        document.getElementById(
            "notificationStatus"
        ).innerText =
            "Browser tidak mendukung notifikasi.";

        return;
    }

    if(Notification.permission === "default"){

        const permission =
            await Notification.requestPermission();

        updateNotificationStatus(
            permission
        );

    }else{

        updateNotificationStatus(
            Notification.permission
        );

    }

}


function updateNotificationStatus(permission){

    const element =
        document.getElementById(
            "notificationStatus"
        );

    if(permission==="granted"){

        element.innerText =
            "🔔 Notifikasi aktif";

    }else{

        element.innerText =
            "⚠️ Notifikasi belum diizinkan";

    }

}


/* =========================
   KIRIM NOTIFIKASI
========================= */

function notify(title,message){

    if(
        "Notification" in window &&
        Notification.permission === "granted"
    ){

        new Notification(
            title,
            {
                body:message,
                icon:"icon-192.png"
            }
        );

    }

}


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText=message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            6000
        );

}


/* =========================
   EDIT TUGAS
========================= */

function editTask(id){

    const task =
        tasks.find(
            t => t.id === id
        );

    if(!task) return;

    const newName =
        prompt(
            "Nama tugas:",
            task.name
        );

    if(newName === null) return;

    if(!newName.trim()){

        alert("Nama tugas tidak boleh kosong.");

        return;
    }

    const newDeadline =
        prompt(
            "Deadline (contoh: 2026-09-15T20:00):",
            task.deadline
        );

    if(newDeadline === null) return;

    const newTime =
        new Date(newDeadline).getTime();

    if(
        isNaN(newTime) ||
        newTime <= Date.now()
    ){

        alert(
            "Format deadline tidak valid atau sudah lewat."
        );

        return;
    }

    task.name =
        newName.trim();

    task.deadline =
        newDeadline;

    /*
       Reset semua alarm
       karena deadline berubah.
    */

    task.alarm1day=false;
    task.alarm3=false;
    task.alarmDeadline=false;

    saveTasks();

    renderTasks();

    showToast(
        "✏️ Tugas berhasil diperbarui!"
    );

}


/* =========================
   HAPUS TUGAS
========================= */

function deleteTask(id){

    const task =
        tasks.find(
            t => t.id === id
        );

    if(!task) return;

    const yakin =
        confirm(
            `Hapus tugas "${task.name}"?`
        );

    if(!yakin) return;

    tasks =
        tasks.filter(
            t => t.id !== id
        );

    saveTasks();

    renderTasks();

    showToast(
        "🗑️ Tugas berhasil dihapus."
    );

}


/* =========================
   FORMAT TANGGAL
========================= */

function formatDate(date){

    return date.toLocaleString(
        "id-ID",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================
   KEAMANAN HTML
========================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

renderTasks();

requestNotification();

setInterval(
    updateCountdown,
    1000
);

setInterval(
    checkAlarms,
    1000
);

updateCountdown();

checkAlarms();

</script>

</body>
</html>
