<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#111827">

<meta name="description"
      content="Aplikasi pengingat tugas dan deadline">

<title>Tugas Deadline</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:25px 18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:26px;
}

header p{
    margin:8px 0 0;
    color:#d1d5db;
    font-size:14px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:16px;
    box-shadow:
        0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:7px;
    border:1px solid #d1d5db;
    border-radius:11px;
    font-size:15px;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 15px;
    font-size:15px;
    cursor:pointer;
}

.btn-add{
    width:100%;
    margin-top:15px;
    background:#111827;
    color:white;
}

.btn-notif{
    width:100%;
    margin-top:10px;
    background:#2563eb;
    color:white;
}

.btn-sound{
    width:100%;
    margin-top:10px;
    background:#7c3aed;
    color:white;
}

.status{
    text-align:center;
    margin-top:12px;
    font-size:13px;
    color:#6b7280;
}

.task{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:16px;
    margin-top:13px;
}

.task h3{
    margin:0 0 10px;
    font-size:18px;
}

.deadline{
    font-size:14px;
    margin-bottom:10px;
}

.countdown{
    background:#f3f4f6;
    border-radius:10px;
    padding:12px;
    font-weight:bold;
    text-align:center;
    margin-bottom:12px;
}

.alarm-box{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    line-height:1.8;
    font-size:14px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.btn-edit{
    flex:1;
    background:#f59e0b;
    color:white;
}

.btn-delete{
    flex:1;
    background:#dc2626;
    color:white;
}

.empty{
    text-align:center;
    color:#6b7280;
    padding:20px;
}

.toast{
    position:fixed;
    left:15px;
    right:15px;
    bottom:20px;

    background:#111827;
    color:white;

    padding:16px;

    border-radius:14px;

    display:none;

    z-index:9999;

    box-shadow:
        0 5px 25px rgba(0,0,0,.3);
}

.toast.show{
    display:block;
}

.warning{
    background:#fff7ed;
    border:1px solid #fed7aa;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    line-height:1.6;
    margin-top:12px;
}

</style>
</head>

<body>

<header>

    <h1>📚 Tugas Deadline</h1>

    <p>
        Pengingat tugas 1 hari • 3 jam • deadline
    </p>

</header>


<div class="container">


<!-- =========================
     FORM TAMBAH TUGAS
========================= -->

<div class="card">

    <h2>➕ Tambah Tugas</h2>

    <label>
        Nama Tugas
    </label>

    <input
        type="text"
        id="taskName"
        placeholder="Contoh: Tugas Data Mining"
    >


    <label>
        Deadline
    </label>

    <input
        type="datetime-local"
        id="taskDeadline"
    >


    <button
        class="btn-add"
        onclick="addTask()">

        💾 Simpan Tugas

    </button>


    <button
        class="btn-notif"
        onclick="requestNotification()">

        📱 Aktifkan Notifikasi HP

    </button>


    <button
        class="btn-sound"
        onclick="testSound()">

        🔊 Tes Suara Alarm

    </button>


    <div
        class="status"
        id="notificationStatus">

        Memeriksa status notifikasi...

    </div>


    <div class="warning">

        ⚠️ <b>Penting:</b>
        Izinkan notifikasi ketika browser meminta izin.
        Untuk suara, pastikan volume media HP aktif.

    </div>

</div>


<!-- =========================
     DAFTAR TUGAS
========================= -->

<div class="card">

    <h2>📋 Daftar Tugas</h2>

    <div id="taskList"></div>

</div>


</div>


<div
    class="toast"
    id="toast">
</div>


<script>


/* =====================================================
   DATA
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem("tugasDeadline") || "[]"
    );


/* =====================================================
   SIMPAN
===================================================== */

function saveTasks(){

    localStorage.setItem(
        "tugasDeadline",
        JSON.stringify(tasks)
    );

}


/* =====================================================
   TAMBAH TUGAS
===================================================== */

function addTask(){

    const name =
        document
        .getElementById("taskName")
        .value
        .trim();


    const deadline =
        document
        .getElementById("taskDeadline")
        .value;


    if(!name){

        alert("Nama tugas belum diisi!");

        return;

    }


    if(!deadline){

        alert("Deadline belum diisi!");

        return;

    }


    const deadlineTime =
        new Date(deadline).getTime();


    if(
        isNaN(deadlineTime) ||
        deadlineTime <= Date.now()
    ){

        alert(
            "Deadline harus berada di masa depan!"
        );

        return;

    }


    const task = {

        id:Date.now(),

        name:name,

        deadline:deadline,

        alarm1day:false,

        alarm3:false,

        alarmDeadline:false

    };


    tasks.push(task);


    saveTasks();


    document
        .getElementById("taskName")
        .value="";


    document
        .getElementById("taskDeadline")
        .value="";


    renderTasks();


    showToast(
        "✅ Tugas berhasil disimpan!"
    );

}


/* =====================================================
   TAMPILKAN TUGAS
===================================================== */

function renderTasks(){

    const list =
        document.getElementById("taskList");


    if(tasks.length===0){

        list.innerHTML = `
            <div class="empty">
                📭 Belum ada tugas.
            </div>
        `;

        return;

    }


    list.innerHTML="";


    tasks.forEach(task => {

        const deadline =
            new Date(task.deadline);


        const div =
            document.createElement("div");


        div.className="task";


        div.innerHTML=`

            <h3>
                📚 ${escapeHTML(task.name)}
            </h3>


            <div class="deadline">

                ⏰ <b>Deadline:</b><br>

                ${formatDate(deadline)}

            </div>


            <div
                class="countdown"
                id="count-${task.id}">

                Menghitung...

            </div>


            <div class="alarm-box">

                📅
                <b>Alarm 1 hari:</b>
                ${
                    task.alarm1day
                    ? "✅ Sudah berbunyi"
                    : "⏳ Menunggu"
                }

                <br>


                🔔
                <b>Alarm 3 jam:</b>
                ${
                    task.alarm3
                    ? "✅ Sudah berbunyi"
                    : "⏳ Menunggu"
                }

                <br>


                🚨
                <b>Alarm Deadline:</b>
                ${
                    task.alarmDeadline
                    ? "✅ Sudah berbunyi"
                    : "⏳ Menunggu"
                }

            </div>


            <div class="actions">

                <button
                    class="btn-edit"
                    onclick="editTask(${task.id})">

                    ✏️ Edit

                </button>


                <button
                    class="btn-delete"
                    onclick="deleteTask(${task.id})">

                    🗑️ Hapus

                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* =====================================================
   COUNTDOWN
===================================================== */

function updateCountdown(){

    tasks.forEach(task => {

        const element =
            document.getElementById(
                "count-"+task.id
            );


        if(!element) return;


        const deadline =
            new Date(task.deadline).getTime();


        let diff =
            deadline - Date.now();


        if(diff<=0){

            element.innerHTML =
                "🚨 DEADLINE SUDAH TIBA";

            return;

        }


        const days =
            Math.floor(
                diff / 86400000
            );


        diff %= 86400000;


        const hours =
            Math.floor(
                diff / 3600000
            );


        diff %= 3600000;


        const minutes =
            Math.floor(
                diff / 60000
            );


        const seconds =
            Math.floor(
                (diff % 60000) / 1000
            );


        element.innerHTML =

            `⏳ ${days} hari ` +
            `${hours} jam ` +
            `${minutes} menit ` +
            `${seconds} detik`;

    });

}


/* =====================================================
   CEK ALARM
===================================================== */

function checkAlarms(){

    const now =
        Date.now();


    let changed=false;


    tasks.forEach(task => {

        const deadline =
            new Date(task.deadline).getTime();


        /* =============================================
           1 HARI
        ============================================= */

        if(

            now >= deadline - 86400000 &&

            now < deadline - 10800000 &&

            !task.alarm1day

        ){

            const message =

                `Perhatian! ` +

                `Tugas ${task.name} ` +

                `akan mencapai deadline ` +

                `dalam satu hari. ` +

                `Harap segera selesaikan ` +

                `tugas tersebut.`;


            speak(message);


            notify(

                `📅 Pengingat: ${task.name}`,

                `Deadline dalam 1 hari. ` +

                `Harap segera selesaikan ` +

                `tugas tersebut.`

            );


            showToast(
                "📅 "+message
            );


            task.alarm1day=true;


            changed=true;

        }


        /* =============================================
           3 JAM
        ============================================= */

        if(

            now >= deadline - 10800000 &&

            now < deadline &&

            !task.alarm3

        ){

            const message =

                `Perhatian! ` +

                `Tugas ${task.name} ` +

                `akan mencapai deadline ` +

                `dalam tiga jam. ` +

                `Harap segera selesaikan ` +

                `tugas tersebut.`;


            speak(message);


            notify(

                `🔔 Pengingat: ${task.name}`,

                `Deadline dalam 3 jam. ` +

                `Harap segera selesaikan ` +

                `tugas tersebut.`

            );


            showToast(
                "🔔 "+message
            );


            task.alarm3=true;


            changed=true;

        }


        /* =============================================
           DEADLINE
        ============================================= */

        if(

            now >= deadline &&

            !task.alarmDeadline

        ){

            const message =

                `Perhatian! ` +

                `Deadline tugas ${task.name} ` +

                `telah tiba. ` +

                `Harap segera selesaikan ` +

                `tugas tersebut.`;


            speak(message);


            notify(

                `🚨 DEADLINE: ${task.name}`,

                `Deadline telah tiba. ` +

                `Harap segera selesaikan ` +

                `tugas tersebut.`

            );


            showToast(
                "🚨 "+message
            );


            task.alarmDeadline=true;


            changed=true;

        }

    });


    if(changed){

        saveTasks();

        renderTasks();

    }

}


/* =====================================================
   SUARA
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Browser HP kamu tidak mendukung suara."
        );

        return;

    }


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(text);


    voice.lang="id-ID";


    /*
       Dibuat lambat supaya
       nama tugas terdengar jelas.
    */

    voice.rate=0.70;


    voice.pitch=1;


    voice.volume=1;


    const voices =
        speechSynthesis.getVoices();


    const indonesia =
        voices.find(
            v =>
                v.lang &&
                v.lang
                .toLowerCase()
                .startsWith("id")
        );


    if(indonesia){

        voice.voice=indonesia;

    }


    speechSynthesis.speak(
        voice
    );

}


/* =====================================================
   TES SUARA
===================================================== */

function testSound(){

    speak(

        "Halo. " +

        "Ini adalah tes suara alarm tugas. " +

        "Suara pengingat sudah aktif. " +

        "Harap segera selesaikan tugas Anda " +

        "sebelum mencapai deadline."

    );


    showToast(
        "🔊 Suara alarm sedang dites..."
    );

}


/* =====================================================
   NOTIFIKASI
===================================================== */

async function requestNotification(){

    if(
        !("Notification" in window)
    ){

        document
            .getElementById(
                "notificationStatus"
            )
            .innerText =
                "❌ Browser tidak mendukung notifikasi.";

        return;

    }


    if(
        Notification.permission === "granted"
    ){

        updateNotificationStatus();

        showToast(
            "✅ Notifikasi HP sudah aktif!"
        );

        return;

    }


    if(
        Notification.permission === "denied"
    ){

        updateNotificationStatus();

        alert(

            "Notifikasi diblokir. " +

            "Buka pengaturan izin situs di browser " +

            "lalu aktifkan Notifikasi."

        );

        return;

    }


    const permission =
        await Notification.requestPermission();


    updateNotificationStatus();


    if(permission==="granted"){

        showToast(
            "📱 Notifikasi HP berhasil diaktifkan!"
        );


        notify(

            "✅ Tugas Deadline",

            "Notifikasi HP sudah aktif."

        );

    }

}


/* =====================================================
   STATUS NOTIFIKASI
===================================================== */

function updateNotificationStatus(){

    const element =
        document.getElementById(
            "notificationStatus"
        );


    if(
        !("Notification" in window)
    ){

        element.innerText =
            "❌ Notifikasi tidak didukung.";

        return;

    }


    if(
        Notification.permission === "granted"
    ){

        element.innerText =
            "🟢 Notifikasi HP AKTIF";

    }

    else if(
        Notification.permission === "denied"
    ){

        element.innerText =
            "🔴 Notifikasi DIBLOKIR";

    }

    else{

        element.innerText =
            "🟡 Notifikasi belum diizinkan";

    }

}


/* =====================================================
   KIRIM NOTIFIKASI
===================================================== */

function notify(title,message){

    if(

        "Notification" in window &&

        Notification.permission === "granted"

    ){

        try{

            new Notification(

                title,

                {
                    body:message,

                    icon:"icon-192.png",

                    tag:
                        "tugas-deadline-"+Date.now(),

                    requireInteraction:true

                }

            );

        }

        catch(error){

            console.log(
                "Notification error:",
                error
            );

        }

    }

}


/* =====================================================
   EDIT
===================================================== */

function editTask(id){

    const task =
        tasks.find(
            t => t.id===id
        );


    if(!task) return;


    const newName =
        prompt(
            "Nama tugas:",
            task.name
        );


    if(newName===null) return;


    const newDeadline =
        prompt(

            "Deadline dengan format " +

            "2026-09-15T20:00:",

            task.deadline

        );


    if(newDeadline===null) return;


    const time =
        new Date(
            newDeadline
        ).getTime();


    if(

        isNaN(time) ||

        time<=Date.now()

    ){

        alert(
            "Deadline tidak valid!"
        );

        return;

    }


    task.name =
        newName.trim();


    task.deadline =
        newDeadline;


    /*
       Reset alarm
       karena deadline berubah.
    */

    task.alarm1day=false;

    task.alarm3=false;

    task.alarmDeadline=false;


    saveTasks();

    renderTasks();


    showToast(
        "✏️ Tugas berhasil diperbarui!"
    );

}


/* =====================================================
   HAPUS
===================================================== */

function deleteTask(id){

    const task =
        tasks.find(
            t => t.id===id
        );


    if(!task) return;


    if(

        !confirm(
            `Hapus tugas "${task.name}"?`
        )

    ){

        return;

    }


    tasks =
        tasks.filter(
            t => t.id!==id
        );


    saveTasks();

    renderTasks();


    showToast(
        "🗑️ Tugas berhasil dihapus."
    );

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatDate(date){

    return date.toLocaleString(

        "id-ID",

        {

            weekday:"long",

            day:"2-digit",

            month:"long",

            year:"numeric",

            hour:"2-digit",

            minute:"2-digit"

        }

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(

            () => {

                toast.classList.remove(
                    "show"
                );

            },

            6000

        );

}


/* =====================================================
   START
===================================================== */

/* semua fungsi addTask(),
   renderTasks(),
   checkAlarms(),
   speak(),
   notify(),
   editTask(),
   deleteTask(),
   dll berada di atas sini */


/* =====================================================
   START APLIKASI
===================================================== */

renderTasks();

updateNotificationStatus();

updateCountdown();

checkAlarms();


setInterval(
    updateCountdown,
    1000
);


setInterval(
    checkAlarms,
    1000
);


if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        function(){

            speechSynthesis.getVoices();

        };

}


if("Notification" in window){

    updateNotificationStatus();

}else{

    document
        .getElementById("notificationStatus")
        .innerText =
        "❌ Browser tidak mendukung notifikasi.";

}


document.addEventListener(
    "click",
    function(){

        if("speechSynthesis" in window){

            speechSynthesis.getVoices();

        }

    },
    { once:true }
);


console.log(
    "📚 Tugas Deadline aktif!"
);

console.log(
    "📅 Alarm 1 hari aktif."
);

console.log(
    "🔔 Alarm 3 jam aktif."
);

console.log(
    "🚨 Alarm deadline aktif."
);

console.log(
    "🔊 Sistem suara aktif."
);

console.log(
    "📱 Sistem notifikasi aktif."
);

</script>

</body>
</html>
