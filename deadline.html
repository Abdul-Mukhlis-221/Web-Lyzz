<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tugas Deadline</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
    transition:.3s;
}

body.dark{
    background:#111827;
    color:#f9fafb;
}

header{
    background:#111827;
    color:white;
    padding:25px 18px;
    text-align:center;
    border-radius:0 0 25px 25px;
}

header h1{
    font-size:26px;
    margin-bottom:7px;
}

header p{
    font-size:14px;
    opacity:.8;
}

.container{
    width:92%;
    max-width:650px;
    margin:20px auto 40px;
}

.card{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    transition:.3s;
}

.dark .card{
    background:#1f2937;
    color:#f9fafb;
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:11px;
    margin-bottom:10px;
    font-size:15px;
    outline:none;
    background:white;
    color:#111827;
}

.dark input{
    background:#374151;
    color:white;
    border-color:#4b5563;
}

input:focus{
    border-color:#2563eb;
}

button{
    border:none;
    border-radius:11px;
    padding:12px 15px;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.97);
}

.btn-add{
    background:#111827;
    color:white;
    width:100%;
}

.btn-notif{
    background:#2563eb;
    color:white;
    width:100%;
    margin-bottom:8px;
}

.btn-test{
    background:#16a34a;
    color:white;
    width:100%;
}

.btn-dark{
    background:#6b7280;
    color:white;
    width:100%;
    margin-top:8px;
}

.status{
    text-align:center;
    font-size:13px;
    margin-top:10px;
    color:#6b7280;
}

.dark .status{
    color:#d1d5db;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:18px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:15px 5px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.dark .stat{
    background:#1f2937;
}

.stat-number{
    font-size:22px;
    font-weight:bold;
    margin-bottom:4px;
}

.stat-text{
    font-size:11px;
    color:#6b7280;
}

.dark .stat-text{
    color:#d1d5db;
}

.task{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    background:#fafafa;
}

.dark .task{
    background:#374151;
    border-color:#4b5563;
}

.task-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.deadline{
    font-size:13px;
    color:#6b7280;
    margin-bottom:9px;
}

.dark .deadline{
    color:#d1d5db;
}

.countdown{
    font-size:15px;
    font-weight:bold;
    margin-bottom:12px;
    line-height:1.5;
}

.normal{
    color:#2563eb;
}

.warning{
    color:#d97706;
}

.danger{
    color:#dc2626;
}

.finished{
    color:#991b1b;
}

.actions{
    display:flex;
    gap:7px;
}

.btn-edit{
    background:#f59e0b;
    color:white;
    flex:1;
}

.btn-delete{
    background:#dc2626;
    color:white;
    flex:1;
}

.empty{
    text-align:center;
    color:#9ca3af;
    padding:25px 5px;
}

.alarm-info{
    background:#eff6ff;
    border-radius:12px;
    padding:13px;
    font-size:13px;
    line-height:1.6;
    color:#1e40af;
    margin-top:10px;
}

.dark .alarm-info{
    background:#1e3a5f;
    color:#bfdbfe;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#111827;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:9999;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

footer{
    text-align:center;
    color:#9ca3af;
    font-size:12px;
    padding:15px;
}

@media(max-width:400px){
    header h1{
        font-size:23px;
    }

    .container{
        width:94%;
    }

    .stats{
        gap:5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Tugas Deadline</h1>
    <p>Jangan sampai tugasmu terlambat!</p>
</header>

<div class="container">

    <!-- STATISTIK -->
    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totalTask">0</div>
            <div class="stat-text">Total Tugas</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="activeTask">0</div>
            <div class="stat-text">Belum Deadline</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="lateTask">0</div>
            <div class="stat-text">Lewat Deadline</div>
        </div>

    </div>


    <!-- TAMBAH TUGAS -->
    <div class="card">

        <h2>➕ Tambah Tugas</h2>

        <input
            type="text"
            id="taskName"
            placeholder="Contoh: Tugas Pemrograman Web"
        >

        <input
            type="datetime-local"
            id="taskDeadline"
        >

        <button
            class="btn-add"
            onclick="addTask()">
            💾 Simpan Tugas
        </button>

    </div>


    <!-- NOTIFIKASI -->
    <div class="card">

        <h2>🔔 Notifikasi Chrome</h2>

        <button
            class="btn-notif"
            onclick="enableNotifications()">
            🔔 Aktifkan Notifikasi
        </button>

        <button
            class="btn-test"
            onclick="testNotification()">
            🔊 Tes Notifikasi & Suara
        </button>

        <button
            class="btn-dark"
            onclick="toggleDarkMode()">
            🌙 Mode Gelap
        </button>

        <div
            class="status"
            id="notificationStatus">
            Status: belum dicek
        </div>

        <div class="alarm-info">
            ⏰ <b>Pengingat otomatis:</b><br>
            • 1 hari sebelum deadline<br>
            • 3 jam sebelum deadline<br>
            • Saat deadline tiba
        </div>

    </div>


    <!-- DAFTAR TUGAS -->
    <div class="card">

        <h2>📋 Daftar Tugas</h2>

        <div id="taskList"></div>

    </div>

</div>

<footer>
    Tugas Deadline • By.Lyzz
</footer>

<div id="toast" class="toast"></div>


<script>

/* ==========================================
   DATA TUGAS
========================================== */

let tasks =
    JSON.parse(
        localStorage.getItem("tugasDeadline")
    ) || [];


/* ==========================================
   SIMPAN DATA
========================================== */

function saveTasks(){

    localStorage.setItem(
        "tugasDeadline",
        JSON.stringify(tasks)
    );

}


/* ==========================================
   TAMBAH TUGAS
========================================== */

function addTask(){

    const name =
        document
        .getElementById("taskName")
        .value
        .trim();

    const deadline =
        document
        .getElementById("taskDeadline")
        .value;


    if(name === ""){

        alert("Nama tugas belum diisi.");

        return;
    }


    if(deadline === ""){

        alert("Tanggal dan jam deadline belum dipilih.");

        return;
    }


    const deadlineTime =
        new Date(deadline).getTime();


    if(deadlineTime <= Date.now()){

        alert(
            "Deadline harus berada di masa depan."
        );

        return;
    }


    const task = {

        id:Date.now(),

        name:name,

        deadline:deadline,

        alarm1day:false,

        alarm3hour:false,

        alarmDeadline:false

    };


    tasks.push(task);

    saveTasks();

    document
        .getElementById("taskName")
        .value = "";

    document
        .getElementById("taskDeadline")
        .value = "";


    renderTasks();

    updateStats();

    showToast(
        "✅ Tugas berhasil ditambahkan."
    );

}


/* ==========================================
   RENDER TUGAS
========================================== */

function renderTasks(){

    const list =
        document.getElementById("taskList");


    if(tasks.length === 0){

        list.innerHTML = `
            <div class="empty">
                📭 Belum ada tugas.<br>
                Tambahkan tugas pertamamu!
            </div>
        `;

        return;
    }


    /* Urutkan berdasarkan deadline */

    const sortedTasks =
        [...tasks].sort(
            (a,b) =>
            new Date(a.deadline) -
            new Date(b.deadline)
        );


    list.innerHTML = "";


    sortedTasks.forEach(task => {

        const div =
            document.createElement("div");


        div.className = "task";


        div.innerHTML = `

            <div class="task-name">
                📚 ${escapeHTML(task.name)}
            </div>

            <div class="deadline">
                🗓️ ${formatDate(task.deadline)}
            </div>

            <div
                class="countdown"
                id="countdown-${task.id}">
                Menghitung...
            </div>

            <div class="actions">

                <button
                    class="btn-edit"
                    onclick="editTask(${task.id})">
                    ✏️ Edit
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteTask(${task.id})">
                    🗑️ Hapus
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* ==========================================
   AMANKAN TEKS
========================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ==========================================
   FORMAT TANGGAL
========================================== */

function formatDate(dateString){

    const date =
        new Date(dateString);


    return date.toLocaleString(
        "id-ID",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* ==========================================
   EDIT TUGAS
========================================== */

function editTask(id){

    const task =
        tasks.find(
            t => t.id === id
        );


    if(!task) return;


    const newName =
        prompt(
            "Masukkan nama tugas:",
            task.name
        );


    if(newName === null){

        return;

    }


    const cleanName =
        newName.trim();


    if(cleanName === ""){

        alert(
            "Nama tugas tidak boleh kosong."
        );

        return;

    }


    task.name = cleanName;


    saveTasks();

    renderTasks();

    showToast(
        "✏️ Tugas berhasil diedit."
    );

}


/* ==========================================
   HAPUS TUGAS
========================================== */

function deleteTask(id){

    const task =
        tasks.find(
            t => t.id === id
        );


    if(!task) return;


    const yakin =
        confirm(
            `Yakin ingin menghapus "${task.name}"?`
        );


    if(!yakin) return;


    tasks =
        tasks.filter(
            t => t.id !== id
        );


    saveTasks();

    renderTasks();

    updateStats();

    showToast(
        "🗑️ Tugas berhasil dihapus."
    );

}


/* ==========================================
   COUNTDOWN
========================================== */

function updateCountdown(){

    const now =
        Date.now();


    tasks.forEach(task => {

        const deadline =
            new Date(
                task.deadline
            ).getTime();


        const element =
            document.getElementById(
                `countdown-${task.id}`
            );


        if(!element) return;


        const difference =
            deadline - now;


        if(difference <= 0){

            element.innerHTML =
                "🚨 DEADLINE SUDAH TIBA";

            element.className =
                "countdown finished";

            return;

        }


        const days =
            Math.floor(
                difference /
                (1000 * 60 * 60 * 24)
            );


        const hours =
            Math.floor(
                (difference %
                (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );


        const minutes =
            Math.floor(
                (difference %
                (1000 * 60 * 60)) /
                (1000 * 60)
            );


        const seconds =
            Math.floor(
                (difference %
                (1000 * 60)) /
                1000
            );


        element.innerHTML =
            `⏳ ${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;


        if(
            days === 0 &&
            hours < 3
        ){

            element.className =
                "countdown danger";

        }
        else if(
            days === 0
        ){

            element.className =
                "countdown warning";

        }
        else{

            element.className =
                "countdown normal";

        }

    });

}


/* ==========================================
   STATISTIK
========================================== */

function updateStats(){

    const now =
        Date.now();


    let late = 0;


    tasks.forEach(task => {

        if(
            new Date(task.deadline).getTime()
            <= now
        ){

            late++;

        }

    });


    document
        .getElementById("totalTask")
        .innerText =
        tasks.length;


    document
        .getElementById("lateTask")
        .innerText =
        late;


    document
        .getElementById("activeTask")
        .innerText =
        tasks.length - late;

}


/* ==========================================
   SUARA
========================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "id-ID";


    speech.rate =
        0.75;


    speech.volume =
        1;


    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/* ==========================================
   NOTIFIKASI CHROME
========================================== */

async function sendNotification(
    title,
    message,
    id
){

    if(
        !("Notification" in window)
    ){

        return;

    }


    if(
        Notification.permission !==
        "granted"
    ){

        return;

    }


    try{

        if(
            "serviceWorker" in navigator
        ){

            const registration =
                await navigator
                .serviceWorker
                .ready;


            await registration
                .showNotification(
                    title,
                    {
                        body:message,

                        tag:
                            "tugas-" + id,

                        requireInteraction:true,

                        vibrate:
                            [200,100,200],

                        data:{
                            taskId:id
                        }
                    }
                );

        }
        else{

            new Notification(
                title,
                {
                    body:message
                }
            );

        }

    }
    catch(error){

        console.log(
            "Notifikasi gagal:",
            error
        );

    }

}


/* ==========================================
   AKTIFKAN NOTIFIKASI
========================================== */

async function enableNotifications(){

    if(
        !("Notification" in window)
    ){

        alert(
            "Chrome tidak mendukung notifikasi."
        );

        return;

    }


    if(
        Notification.permission ===
        "granted"
    ){

        updateNotificationStatus();

        showToast(
            "🟢 Notifikasi sudah aktif."
        );

        return;

    }


    if(
        Notification.permission ===
        "denied"
    ){

        alert(
            "Notifikasi diblokir. Buka pengaturan izin situs Chrome lalu pilih Izinkan."
        );

        return;

    }


    const permission =
        await Notification.requestPermission();


    updateNotificationStatus();


    if(
        permission === "granted"
    ){

        const message =
            "Notifikasi Tugas Deadline sudah aktif. Kamu akan mendapatkan pengingat tugas.";


        speak(message);


        sendNotification(
            "🔔 Tugas Deadline",
            message,
            "aktif"
        );


        showToast(
            "✅ Notifikasi berhasil diaktifkan!"
        );

    }

}


/* ==========================================
   STATUS NOTIFIKASI
========================================== */

function updateNotificationStatus(){

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if(
        !("Notification" in window)
    ){

        status.innerHTML =
            "❌ Notifikasi tidak didukung.";

        return;

    }


    if(
        Notification.permission ===
        "granted"
    ){

        status.innerHTML =
            "🟢 Status: NOTIFIKASI AKTIF";

    }
    else if(
        Notification.permission ===
        "denied"
    ){

        status.innerHTML =
            "🔴 Status: NOTIFIKASI DIBLOKIR";

    }
    else{

        status.innerHTML =
            "⚪ Status: BELUM DIAKTIFKAN";

    }

}


/* ==========================================
   TES NOTIFIKASI
========================================== */

function testNotification(){

    if(
        !("Notification" in window)
    ){

        alert(
            "Chrome tidak mendukung notifikasi."
        );

        return;

    }


    if(
        Notification.permission !==
        "granted"
    ){

        alert(
            "Aktifkan notifikasi terlebih dahulu."
        );

        return;

    }


    const message =
        "Ini adalah tes pengingat tugas. Harap segera selesaikan tugas tersebut.";


    speak(message);


    sendNotification(
        "🔔 TES TUGAS DEADLINE",
        message,
        "test-" + Date.now()
    );


    showToast(
        "🔊 Tes suara & notifikasi dikirim."
    );

}


/* ==========================================
   CEK ALARM
========================================== */

function checkAlarms(){

    const now =
        Date.now();


    tasks.forEach(task => {

        const deadline =
            new Date(
                task.deadline
            ).getTime();


        /* ==============================
           1 HARI SEBELUM
        ============================== */

        const oneDay =
            24 * 60 * 60 * 1000;


        const threeHours =
            3 * 60 * 60 * 1000;


        if(
            now >= deadline - oneDay &&
            now < deadline - threeHours &&
            !task.alarm1day
        ){

            const message =
                `Perhatian! Tugas ${task.name} akan mencapai deadline dalam satu hari. Harap segera selesaikan tugas tersebut.`;


            speak(message);


            sendNotification(
                "⚠️ DEADLINE BESOK",
                message,
                task.id + "-1day"
            );


            task.alarm1day =
                true;

        }


        /* ==============================
           3 JAM SEBELUM
        ============================== */
        if(
            now >= deadline - threeHours &&
            now < deadline &&
            !task.alarm3hour
        ){

            const message =
                `Perhatian! Tugas ${task.name} akan mencapai deadline dalam tiga jam. Harap segera selesaikan tugas tersebut.`;

            /* Suara */
            speak(message);

            /* Notifikasi Chrome */
            sendNotification(
                "🚨 DEADLINE 3 JAM LAGI",
                message,
                task.id + "-3hour"
            );

            /* Tandai alarm sudah dikirim */
            task.alarm3hour = true;
        }


        /* ==============================
           SAAT DEADLINE TIBA
        ============================== */

        if(
            now >= deadline &&
            !task.alarmDeadline
        ){

            const message =
                `Perhatian! Deadline tugas ${task.name} telah tiba. Harap segera selesaikan tugas tersebut.`;

            /* Suara */
            speak(message);

            /* Notifikasi Chrome */
            sendNotification(
                "🚨 DEADLINE TUGAS",
                message,
                task.id + "-deadline"
            );

            /* Tandai alarm sudah dikirim */
            task.alarmDeadline = true;
        }

    });


    /* Simpan perubahan alarm */
    saveTasks();

    /* Perbarui statistik */
    updateStats();

}


/* ==========================================
   TOAST / PESAN KECIL
========================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.classList.add("show");

    setTimeout(
        () => {
            toast.classList.remove("show");
        },
        3000
    );

}


/* ==========================================
   MODE GELAP
========================================== */

function toggleDarkMode(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "darkMode",
        dark
    );

}


/* ==========================================
   LOAD MODE GELAP
========================================== */

if(
    localStorage.getItem("darkMode") === "true"
){

    document.body.classList.add("dark");

}


/* ==========================================
   SERVICE WORKER
========================================== */

if(
    "serviceWorker" in navigator
){

    navigator.serviceWorker
        .register("sw.js")
        .then(() => {

            console.log(
                "Service Worker berhasil aktif."
            );

        })
        .catch(error => {

            console.log(
                "Service Worker gagal:",
                error
            );

        });

}


/* ==========================================
   JALANKAN WEB
========================================== */

renderTasks();

updateStats();

updateNotificationStatus();

updateCountdown();

checkAlarms();


/* ==========================================
   UPDATE COUNTDOWN SETIAP 1 DETIK
========================================== */

setInterval(
    updateCountdown,
    1000
);


/* ==========================================
   CEK ALARM SETIAP 10 DETIK
========================================== */

setInterval(
    checkAlarms,
    10000
);

</script>

</body>
</html>
