<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tugas Deadline</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:22px 18px;
    text-align:center;
    border-radius:0 0 25px 25px;
}

header h1{
    font-size:25px;
    margin-bottom:6px;
}

header p{
    font-size:14px;
    opacity:.8;
}

.container{
    width:92%;
    max-width:650px;
    margin:20px auto 40px;
}

.card{
    background:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    margin-bottom:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 15px;
    font-size:14px;
    cursor:pointer;
    margin:3px;
}

.btn-add{
    background:#111827;
    color:white;
    width:100%;
}

.btn-notif{
    background:#2563eb;
    color:white;
    width:100%;
}

.btn-test{
    background:#16a34a;
    color:white;
    width:100%;
}

.status{
    text-align:center;
    font-size:13px;
    margin-top:8px;
    color:#6b7280;
}

.task{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    background:#fafafa;
}

.task-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.deadline{
    font-size:13px;
    color:#6b7280;
    margin-bottom:8px;
}

.countdown{
    font-size:15px;
    font-weight:bold;
    margin-bottom:12px;
}

.normal{
    color:#2563eb;
}

.warning{
    color:#d97706;
}

.danger{
    color:#dc2626;
}

.finished{
    color:#991b1b;
}

.actions{
    display:flex;
    gap:5px;
}

.btn-edit{
    background:#f59e0b;
    color:white;
    flex:1;
}

.btn-delete{
    background:#dc2626;
    color:white;
    flex:1;
}

.empty{
    text-align:center;
    color:#9ca3af;
    padding:20px 5px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:9999;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
}

footer{
    text-align:center;
    color:#9ca3af;
    font-size:12px;
    padding:15px;
}
</style>
</head>

<body>

<header>
    <h1>📚 Tugas Deadline</h1>
    <p>Pengingat tugas agar tidak terlambat</p>
</header>

<div class="container">

    <!-- TAMBAH TUGAS -->
    <div class="card">
        <h2>➕ Tambah Tugas</h2>

        <input
            type="text"
            id="taskName"
            placeholder="Nama tugas..."
        >

        <input
            type="datetime-local"
            id="taskDeadline"
        >

        <button
            class="btn-add"
            onclick="addTask()">
            💾 Simpan Tugas
        </button>
    </div>


    <!-- NOTIFIKASI -->
    <div class="card">

        <h2>🔔 Notifikasi Chrome</h2>

        <button
            class="btn-notif"
            onclick="enableNotifications()">
            🔔 Aktifkan Notifikasi
        </button>

        <button
            class="btn-test"
            onclick="testNotification()">
            🔊 Tes Suara & Notifikasi
        </button>

        <div
            class="status"
            id="notificationStatus">
            Status: belum dicek
        </div>

    </div>


    <!-- DAFTAR TUGAS -->
    <div class="card">

        <h2>📋 Daftar Tugas</h2>

        <div id="taskList"></div>

    </div>

</div>

<footer>
    Tugas Deadline • Pengingat otomatis
</footer>

<div id="toast" class="toast"></div>


<script>

/* =====================================
   DATA
===================================== */

let tasks = JSON.parse(
    localStorage.getItem("tugasDeadline")
) || [];


/* =====================================
   SIMPAN DATA
===================================== */

function saveTasks(){

    localStorage.setItem(
        "tugasDeadline",
        JSON.stringify(tasks)
    );

}


/* =====================================
   TAMBAH TUGAS
===================================== */

function addTask(){

    const name =
        document.getElementById("taskName").value.trim();

    const deadline =
        document.getElementById("taskDeadline").value;


    if(name === ""){
        alert("Nama tugas belum diisi.");
        return;
    }

    if(deadline === ""){
        alert("Deadline belum dipilih.");
        return;
    }


    const task = {

        id: Date.now(),

        name: name,

        deadline: deadline,

        alarm1day: false,

        alarm3hour: false,

        alarmDeadline: false

    };


    tasks.push(task);

    saveTasks();

    document.getElementById("taskName").value = "";

    document.getElementById("taskDeadline").value = "";

    renderTasks();

    showToast("✅ Tugas berhasil ditambahkan.");

}


/* =====================================
   TAMPILKAN TUGAS
===================================== */

function renderTasks(){

    const list =
        document.getElementById("taskList");


    if(tasks.length === 0){

        list.innerHTML = `
            <div class="empty">
                Belum ada tugas.
            </div>
        `;

        return;

    }


    list.innerHTML = "";


    tasks.forEach(task => {

        const div =
            document.createElement("div");

        div.className = "task";


        div.innerHTML = `

            <div class="task-name">
                📚 ${escapeHTML(task.name)}
            </div>

            <div class="deadline">
                🗓️ Deadline:
                ${formatDate(task.deadline)}
            </div>

            <div
                class="countdown"
                id="countdown-${task.id}">
                Menghitung...
            </div>

            <div class="actions">

                <button
                    class="btn-edit"
                    onclick="editTask(${task.id})">
                    ✏️ Edit
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteTask(${task.id})">
                    🗑️ Hapus
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================
   FORMAT TANGGAL
===================================== */

function formatDate(dateString){

    const date =
        new Date(dateString);

    return date.toLocaleString(
        "id-ID",
        {
            day:"2-digit",
            month:"long",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================
   EDIT TUGAS
===================================== */

function editTask(id){

    const task =
        tasks.find(t => t.id === id);

    if(!task) return;


    const newName =
        prompt(
            "Nama tugas:",
            task.name
        );


    if(newName === null) return;


    const cleanName =
        newName.trim();


    if(cleanName === ""){
        alert("Nama tugas tidak boleh kosong.");
        return;
    }


    task.name = cleanName;


    saveTasks();

    renderTasks();

    showToast("✏️ Tugas berhasil diedit.");

}


/* =====================================
   HAPUS TUGAS
===================================== */

function deleteTask(id){

    const task =
        tasks.find(t => t.id === id);

    if(!task) return;


    const yakin =
        confirm(
            `Hapus tugas "${task.name}"?`
        );


    if(!yakin) return;


    tasks =
        tasks.filter(t => t.id !== id);


    saveTasks();

    renderTasks();

    showToast("🗑️ Tugas dihapus.");

}


/* =====================================
   COUNTDOWN
===================================== */

function updateCountdown(){

    const now =
        new Date().getTime();


    tasks.forEach(task => {

        const deadline =
            new Date(task.deadline).getTime();

        const element =
            document.getElementById(
                `countdown-${task.id}`
            );


        if(!element) return;


        const difference =
            deadline - now;


        if(difference <= 0){

            element.innerHTML =
                "🚨 DEADLINE SUDAH TIBA";

            element.className =
                "countdown finished";

            return;

        }


        const days =
            Math.floor(
                difference /
                (1000 * 60 * 60 * 24)
            );


        const hours =
            Math.floor(
                (difference %
                (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );


        const minutes =
            Math.floor(
                (difference %
                (1000 * 60 * 60)) /
                (1000 * 60)
            );


        const seconds =
            Math.floor(
                (difference %
                (1000 * 60)) /
                1000
            );


        element.innerHTML =
            `⏳ ${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;


        if(days === 0 && hours < 3){

            element.className =
                "countdown danger";

        }
        else if(days === 0){

            element.className =
                "countdown warning";

        }
        else{

            element.className =
                "countdown normal";

        }

    });

}


/* =====================================
   SUARA
===================================== */

function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang = "id-ID";

    speech.rate = 0.75;

    speech.volume = 1;

    speech.pitch = 1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================
   NOTIFIKASI
===================================== */

async function sendNotification(
    title,
    message,
    id
){

    if(
        !("Notification" in window)
    ){
        return;
    }


    if(
        Notification.permission !==
        "granted"
    ){
        return;
    }


    try{

        if(
            "serviceWorker" in navigator
        ){

            const registration =
                await navigator.serviceWorker.ready;


            await registration.showNotification(
                title,
                {

                    body: message,

                    tag:
                        "tugas-" + id,

                    requireInteraction:
                        true,

                    vibrate:
                        [200,100,200],

                    data:{
                        taskId:id
                    }

                }
            );

        }
        else{

            new Notification(
                title,
                {
                    body:message
                }
            );

        }

    }
    catch(error){

        console.log(
            "Notifikasi gagal:",
            error
        );

    }

}


/* =====================================
   AKTIFKAN NOTIFIKASI
===================================== */

async function enableNotifications(){

    if(
        !("Notification" in window)
    ){

        alert(
            "Browser ini tidak mendukung notifikasi."
        );

        return;

    }


    if(
        Notification.permission ===
        "granted"
    ){

        updateNotificationStatus();

        showToast(
            "✅ Notifikasi Chrome sudah aktif."
        );

        return;

    }


    if(
        Notification.permission ===
        "denied"
    ){

        alert(
            "Notifikasi diblokir. Silakan aktifkan izin notifikasi situs melalui pengaturan Chrome."
        );

        return;

    }


    const permission =
        await Notification.requestPermission();


    updateNotificationStatus();


    if(
        permission === "granted"
    ){

        showToast(
            "🔔 Notifikasi Chrome berhasil diaktifkan!"
        );


        sendNotification(
            "Tugas Deadline",
            "Notifikasi Chrome sudah aktif.",
            "test"
        );

    }

}


/* =====================================
   STATUS NOTIFIKASI
===================================== */

function updateNotificationStatus(){

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if(!("Notification" in window)){

        status.innerHTML =
            "❌ Browser tidak mendukung notifikasi.";

        return;

    }


    if(
        Notification.permission ===
        "granted"
    ){

        status.innerHTML =
            "🟢 Notifikasi: AKTIF";

    }
    else if(
        Notification.permission ===
        "denied"
    ){

        status.innerHTML =
            "🔴 Notifikasi: DIBLOKIR";

    }
    else{

        status.innerHTML =
            "⚪ Notifikasi: BELUM DIAKTIFKAN";

    }

}


/* =====================================
   TES NOTIFIKASI + SUARA
===================================== */

function testNotification(){

    const message =
        "Ini adalah tes pengingat tugas. Harap segera selesaikan tugas tersebut.";


    speak(message);


    sendNotification(
        "🔔 Tes Tugas Deadline",
        message,
        "test"
    );


    showToast(
        "🔊 Tes suara dan notifikasi dikirim."
    );

}


/* =====================================
   CEK ALARM
===================================== */

function checkAlarms(){

    const now =
        Date.now();


    tasks.forEach(task => {

        const deadline =
            new Date(
                task.deadline
            ).getTime();


        /* =========================
           1 HARI SEBELUM
        ========================= */

        const oneDay =
            24 * 60 * 60 * 1000;


        if(
            now >= deadline - oneDay &&
            now < deadline - (3 * 60 * 60 * 1000) &&
            !task.alarm1day
        ){

            const message =
                `Perhatian! Tugas ${task.name} akan mencapai deadline dalam satu hari. Harap segera selesaikan tugas tersebut.`;


            speak(message);


            sendNotification(
                "⚠️ Deadline Besok",
                message,
                task.id + "-1day"
            );


            task.alarm1day = true;

        }


        /* =========================
           3 JAM SEBELUM
        ========================= */

        const threeHours =
            3 * 60 * 60 * 1000;


        if(
            now >= deadline - threeHours &&
            now < deadline &&
            !task.alarm3hour
        ){

            const message =
                `Perhatian! Tugas ${task.name} akan mencapai deadline dalam tiga jam. Harap segera selesaikan tugas tersebut.`;


            speak(message);


            sendNotification(
                "🚨 Deadline 3 Jam Lagi",
                message,
                task.id + "-3hour"
            );


            task.alarm3hour = true;

        }


        /* =========================
           DEADLINE
        ========================= */

        if(
            now >= deadline &&
            !task.alarmDeadline
        ){

            const message =
                `Perhatian! Deadline tugas ${task.name} telah tiba. Harap segera selesaikan tugas tersebut.`;


            speak(message);


            sendNotification(
                "🚨 DEADLINE TUGAS",
                message,
                task.id + "-deadline"
            );


            task.alarmDeadline = true;

        }

    });


    saveTasks();

}


/* =====================================
   TOAST
===================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    },3000);

}


/* =====================================
   SERVICE WORKER
===================================== */

if(
    "serviceWorker" in navigator
){

    navigator.serviceWorker
        .register("sw.js")
        .then(() => {

            console.log(
                "Service Worker aktif."
            );

        })
        .catch(error => {

            console.log(
                "Service Worker gagal:",
                error
            );

        });

}


/* =====================================
   JALANKAN
===================================== */

renderTasks();

updateNotificationStatus();

updateCountdown();

checkAlarms();


/* Update countdown setiap detik */

setInterval(
    updateCountdown,
    1000
);


/* Cek alarm setiap 10 detik */

setInterval(
    checkAlarms,
    10000
);

</script>

</body>
</html>
