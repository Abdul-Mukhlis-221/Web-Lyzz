<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Halo 👋</h1>

        <p>Website saya berhasil dibuat menggunakan HTML.</p>

        <button onclick="tampilkanPesan()">
            Klik Saya
        </button>

        <p id="pesan"></p>
    </div>

    <script>
        function tampilkanPesan() {
            document.getElementById("pesan").innerHTML =
                "JavaScript berhasil berjalan! 🎉";
        }
    </script>

</body>
</html>
